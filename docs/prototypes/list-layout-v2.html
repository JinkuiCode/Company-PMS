<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMS · 列布局与操作区样稿</title>
<style>
@import url('../../frontend/node_modules/@fontsource-variable/noto-sans-sc/wght.css');
:root{font-family:'Noto Sans SC Variable',sans-serif;font-size:13px;color:#162033;background:#f6f8fb;--line:#e6eaf1;--muted:#667085;--primary:#4f46e5}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:white}button:hover{background:#f4f5fa}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #8b83ed;outline-offset:2px}button:disabled{opacity:.35;cursor:default}button.active{background:#efedff;border-color:#d7d2ff;color:var(--primary)}header{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:white;border-bottom:1px solid var(--line)}header strong{font-size:15px}.badge{border-radius:4px;background:#eef0f5;color:var(--muted);font-size:11px;padding:3px 7px}.spacer{flex:1}main{padding:20px;max-width:1600px;margin:auto}.reviewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.segmented{display:flex;gap:4px}.note{color:var(--muted);font-size:12px}.comparisons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.choice{padding:12px;border:1px solid var(--line);border-radius:6px;background:white;cursor:pointer}.choice.selected{border-color:#8b83ed;box-shadow:0 0 0 1px #8b83ed}.choice-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.choice-title strong{font-size:13px}.sample{display:flex;border-top:1px solid var(--line);height:39px;align-items:center}.sample>span{flex:1;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{width:112px;min-width:112px;padding:0 8px;display:flex;align-items:center;gap:8px;border-left:1px solid #e4e7ee;height:100%;background:inherit}.actions button{width:40px;flex:0 0 40px;height:24px;padding:0;border:0;background:transparent;border-radius:4px;font-size:12px;font-weight:500;color:var(--primary)}.actions button.sync{color:#16806b}.actions button:hover,.actions button:focus-visible{background:#efedff}.style-b .actions,.style-b th.action{background:#f4f5f7}.style-c .actions button{border:1px solid #dce1e9;background:#fff;color:#465164}.style-c .actions button:hover{color:var(--primary);border-color:#c7c2f4;background:#f7f6ff}.sample.hover{background:#f4f6fb}.sample.selected{background:#eeecfb}.sample.readonly .actions button{color:#667085}.workspace{position:relative;background:white;border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}.toolbar{display:flex;align-items:center;gap:8px;padding-bottom:14px}.toolbar h2{font-size:14px;margin:0 12px 0 0}.primary{background:var(--primary);color:white;border-color:var(--primary)}.primary:hover{background:#4338ca}.gridwrap{max-height:400px;min-height:280px;overflow:auto;border:1px solid var(--line);border-radius:5px}table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:12px}th,td{height:38px;padding:0 12px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:white}th{height:36px;background:#f8fafc;color:var(--muted);font-weight:550;text-align:center;position:sticky;top:0;z-index:3}td{border-right:1px solid #f0f2f6}tbody tr:hover td{background:#f4f6fb}tbody tr.selected td{background:#eeecfb}td.action{padding:0}.action .actions{width:100%}th.action,td.action{border-left:1px solid #e4e7ee}.action .actions{border-left:0}.pinned{position:sticky;z-index:2}th.pinned{z-index:4}.edge-left{box-shadow:2px 0 3px #18223008}.edge-right{box-shadow:-2px 0 3px #18223008}.status{color:#078775;background:#e6f5f0;border-radius:12px;padding:2px 9px}.bar{display:inline-block;width:50px;height:5px;background:#e7ecf3;border-radius:3px;vertical-align:middle;margin-right:8px}.bar i{display:block;height:100%;background:#0f9f7a;border-radius:3px}.footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;color:var(--muted)}.settings{position:absolute;right:16px;top:57px;width:540px;max-width:calc(100% - 32px);z-index:8;background:white;border:1px solid #dce2ec;box-shadow:0 12px 38px #16203324;border-radius:8px;overflow:hidden}.settings[hidden]{display:none}.settings-head{padding:14px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.settings-head h3{font-size:14px;margin:0}.icon{width:28px;padding:0}.search{width:calc(100% - 32px);margin:12px 16px;height:32px;border:1px solid var(--line);border-radius:5px;padding:0 10px}.zones{max-height:350px;overflow:auto;padding:0 16px 12px}.zone{min-height:40px;border-bottom:1px solid var(--line);padding:8px 0}.zone h4{margin:0 0 6px;color:var(--muted);font-size:11px;font-weight:550;display:flex;justify-content:space-between}.field{display:flex;align-items:center;gap:8px;height:37px;border-radius:4px;padding:0 4px}.field:hover{background:#f7f8fb}.field.dragging{opacity:.35}.handle{color:#98a2b3;cursor:grab;letter-spacing:2px}.field label{flex:1;display:flex;align-items:center;gap:7px;min-width:0}.field select{font-size:12px;border:1px solid var(--line);background:white;border-radius:4px;height:26px;width:90px}.field .icon{height:24px;width:24px;border-color:transparent}.locked{font-size:11px;color:#98a2b3}.settings-foot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:#fafbfc}.saved{font-size:11px;color:#078775}.warning{color:#a66a0a;font-size:12px;padding:0 16px 10px}.role{max-width:720px}.form-row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.form-row input,.form-row select{height:34px;width:100%;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:white}.preview-result{padding:14px 0;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#162033;color:white;padding:10px 18px;border-radius:6px;z-index:20}.toast:empty{display:none}@media(max-width:760px){main{padding:12px}.comparisons{grid-template-columns:1fr}.choice{padding:10px}header{padding:0 12px}.settings{right:8px;max-width:calc(100% - 16px)}.reviewbar{align-items:flex-start}.field{gap:3px}.field select{width:82px}.form-row{grid-template-columns:92px 1fr}}
</style>
<header><strong>PMS 管理系统</strong><span class="badge">交互样稿 · 不连接业务数据</span><span class="spacer"></span><span class="note">列布局 / 操作区</span></header>
<main>
  <div class="reviewbar"><div class="segmented" id="pages"><button class="active" data-page="archive">项目档案</button><button data-page="progress">项目进度</button><button data-page="role">角色首页设置</button></div><span class="spacer"></span><label class="note">对比状态 <select id="state"><option value="normal">正常</option><option value="hover">悬停</option><option value="selected">选中</option><option value="readonly">只读</option></select></label></div>
  <div class="comparisons" id="comparisons"></div>
  <section class="workspace" id="list"><div class="toolbar"><h2 id="page-title">项目档案</h2><span class="badge" id="style-name">A · 轻分隔</span><span class="spacer"></span><button id="open-settings">列设置</button></div><div class="gridwrap"><table id="table"></table></div><div class="footer"><span>共 8 条 · 样例数据</span><span class="note" id="layout-status">列布局已保存于本机样稿</span><span>50 条/页</span></div>
  <section class="settings" id="settings" hidden aria-label="列设置"><div class="settings-head"><h3>列设置</h3><span class="note" id="count"></span><span class="spacer"></span><button class="icon" id="close-settings" aria-label="关闭列设置" title="关闭">×</button></div><input class="search" id="search" placeholder="搜索字段" aria-label="搜索字段"><div class="zones" id="zones"></div><div class="warning" id="warning"></div><div class="settings-foot"><button id="reset">恢复默认</button><span class="spacer"></span><span class="saved" role="status">自动保存 · 仅当前浏览器样稿</span></div></section>
  </section>
  <section class="workspace role" id="role" hidden><div class="toolbar"><h2>编辑角色</h2><span class="badge">配置样稿</span></div><div class="form-row"><label for="role-name">角色名称</label><input id="role-name" value="操作员" readonly></div><div class="form-row"><label for="home">登录首页</label><select id="home"><option value="首个可访问页面">自动选择</option selected>项目档案</option>项目进度</option></select></div><div class="form-row"><label for="priority">首页优先级</label><input id="priority" type="number" min="0" max="999" value="10"></div><p class="note">仅选择角色有查看权限的页面；多角色时数值大的优先。</p><div class="preview-result" id="home-result"></div><button class="primary" id="role-save">保存样稿</button></section>
</main><div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id), key='pms-prototype-column-layout-v2';
const labels={left:'左侧冻结',center:'中间滚动',right:'右侧冻结'};
const defaults=()=>[
 {id:'code',label:'项目编号',zone:'left',width:150,visible:true},
 {id:'name',label:'项目名称',zone:'center',width:240,visible:true},
 {id:'customer',label:'客户',zone:'center',width:160,visible:true},
 {id:'category',label:'产品类别',zone:'center',width:120,visible:true},
 {id:'manager',label:'负责人',zone:'center',width:110,visible:true},
 {id:'date',label:'计划发货',zone:'center',width:130,visible:true},
 {id:'progress',label:'设计进度',zone:'center',width:120,visible:true},
 {id:'serial',label:'序列号',zone:'center',width:150,visible:false},
 {id:'status',label:'启用状态',zone:'right',width:110,visible:true}
];
let fields=defaults(),page='archive',style='a',state='normal',dragged=null;
try{const s=JSON.parse(localStorage.getItem(key));if(Array.isArray(s)&&s.length===fields.length&&fields.every(f=>s.filter(x=>x.id===f.id).length===1)&&s.every(f=>labels[f.zone]))fields=s}catch{}
const styles=[['a','A · 轻分隔','推荐'],['b','B · 淡中性色','弱化底色'],['c','C · 轻按钮','细边框']];
function actions(readonly=false){return `<div class="actions"><button data-action="edit">${readonly?'查看':'编辑'}</button>${readonly?'':page==='progress'?'<button data-action="more" title="更多操作" aria-label="更多操作">···</button>':'<button class="sync" data-action="sync">同步</button>'}</div>`}
function comparisons(){ $('comparisons').innerHTML=styles.map(([id,title,desc])=>`<div class="choice style-${id} ${style===id?'selected':''}" tabindex="0" role="button" aria-label="选择${title}" data-style="${id}"><div class="choice-title"><strong>${title}</strong><span class="note">${desc}</span></div><div class="sample ${state}"><span>自动清洗设备项目</span>${actions(state==='readonly')}</div></div>`).join('');$('style-name').textContent=styles.find(s=>s[0]===style)[1];$('list').className='workspace style-'+style; }
function ordered(){return ['left','center','right'].flatMap(z=>fields.filter(f=>f.zone===z&&f.visible))}
function renderTable(){const cols=ordered();let left=40,right=112;const positions={};cols.filter(f=>f.zone==='left').forEach(f=>{positions[f.id]=left;left+=f.width});cols.filter(f=>f.zone==='right').reverse().forEach(f=>{positions[f.id]=right;right+=f.width});
const attrs=f=>`class="${f.zone!=='center'?'pinned edge-'+f.zone:''}" style="width:${f.width}px;min-width:${f.width}px;max-width:${f.width}px;${f.zone==='center'?'':f.zone+':'+positions[f.id]+'px;'}"`;
const value=(f,i)=>({code:'PMS-2026-00'+(i+1),name:['自动清洗设备升级项目','高精度检测系统','产线自动化改造','模块化装配设备'][i%4],customer:['华东精密','远景科技','新源制造'][i%3],category:['Bench','Single','HOTSPM'][i%3],manager:['张工','李工','王工'][i%3],date:'2026-10-'+(12+i),progress:'<span class="bar"><i style="width:80%"></i></span>80%',serial:'SN-0260'+i,status:'<span class="status">启用</span>'}[f.id]);
$('table').innerHTML=`<colgroup><col style="width:40px">${cols.map(f=>`<col style="width:${f.width}px">`).join('')}<col style="width:112px"></colgroup><thead><tr><th class="pinned" style="left:0;width:40px"></th>${cols.map(f=>`<th ${attrs(f)}>${f.label}</th>`).join('')}<th class="action pinned" style="right:0;width:112px">操作</th></tr></thead><tbody>${Array.from({length:8},(_,i)=>`<tr class="${state==='selected'&&i===1?'selected':''}"><td class="pinned" style="left:0"><input type="checkbox" aria-label="选择项目${i+1}"></td>${cols.map(f=>`<td ${attrs(f)}>${value(f,i)}</td>`).join('')}<td class="action pinned" style="right:0">${actions(state==='readonly')}</td></tr>`).join('')}</tbody>`;
$('page-title').textContent=page==='progress'?'项目进度':'项目档案';
}
function renderSettings(){const query=$('search').value.trim();$('count').textContent=fields.filter(f=>f.visible).length+' 个可见字段';$('zones').innerHTML=Object.entries(labels).map(([zone,label])=>`<div class="zone" data-zone="${zone}"><h4>${label}<span>${zone==='left'?'勾选列固定最左侧':zone==='right'?'操作列固定最右侧':''}</span></h4>${fields.filter(f=>f.zone===zone&&f.label.includes(query)).map(f=>`<div class="field" draggable="true" data-id="${f.id}"><span class="handle" aria-hidden="true">⠿</span><label><input type="checkbox" data-visible="${f.id}" ${f.visible?'checked':''}>${f.label}</label><select data-zone-select="${f.id}" aria-label="${f.label}冻结位置">${Object.entries(labels).map(([z,l])=>`<option value="${z}" ${z===f.zone?'selected':''}>${l}</option>`).join('')}</select><button class="icon" data-move="-1" data-id="${f.id}" title="上移${f.label}" aria-label="上移${f.label}">↑</button><button class="icon" data-move="1" data-id="${f.id}" title="下移${f.label}" aria-label="下移${f.label}">↓</button></div>`).join('')}</div>`).join('');$('warning').textContent=fields.filter(f=>f.visible&&f.zone!=='center').reduce((n,f)=>n+f.width,152)>$('list').clientWidth*.65?'冻结列较多，中间可滚动区域会变窄。':'';}
function save(){try{localStorage.setItem(key,JSON.stringify(fields));$('layout-status').textContent='列布局已保存于本机样稿'}catch{$('layout-status').textContent='浏览器未允许保存，仅本次生效'}renderTable();renderSettings()}
function toast(text){$('toast').textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',2000)}
$('comparisons').onclick=e=>{const c=e.target.closest('[data-style]');if(c){style=c.dataset.style;comparisons();renderTable()}};
$('comparisons').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}};
$('state').onchange=e=>{state=e.target.value;comparisons();renderTable()};
$('pages').onclick=e=>{if(!e.target.dataset.page)return;page=e.target.dataset.page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('role').hidden=page!=='role';$('list').hidden=page==='role';$('comparisons').hidden=page==='role';if(page!=='role'){comparisons();renderTable()}};
$('open-settings').onclick=()=>{$('settings').hidden=!$('settings').hidden;renderSettings()};$('close-settings').onclick=()=>{$('settings').hidden=true;$('open-settings').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('close-settings').click()});
$('search').oninput=renderSettings;$('reset').onclick=()=>{fields=defaults();save()};
$('zones').onchange=e=>{if(e.target.dataset.visible)fields.find(f=>f.id===e.target.dataset.visible).visible=e.target.checked;if(e.target.dataset.zoneSelect)fields.find(f=>f.id===e.target.dataset.zoneSelect).zone=e.target.value;save()};
$('zones').onclick=e=>{const b=e.target.closest('[data-move]');if(!b)return;const f=fields.find(f=>f.id===b.dataset.id),list=fields.filter(x=>x.zone===f.zone),other=list[list.indexOf(f)+Number(b.dataset.move)];if(other){const a=fields.indexOf(f),c=fields.indexOf(other);[fields[a],fields[c]]=[fields[c],fields[a]];save()}};
$('zones').ondragstart=e=>{const f=e.target.closest('.field');if(f){dragged=f.dataset.id;e.dataTransfer.setData('text/plain',dragged);f.classList.add('dragging')}};
$('zones').ondragover=e=>e.preventDefault();$('zones').ondragend=()=>{dragged=null;renderSettings()};$('zones').ondrop=e=>{e.preventDefault();const z=e.target.closest('[data-zone]');if(!z||!dragged)return;const f=fields.find(f=>f.id===dragged),target=e.target.closest('.field');if(target?.dataset.id===dragged)return;fields=fields.filter(x=>x!==f);f.zone=z.dataset.zone;const index=target?fields.findIndex(x=>x.id===target.dataset.id):fields.length;fields.splice(index,0,f);dragged=null;save()};
$('table').onclick=e=>{if(e.target.dataset.action)toast('样稿演示：'+({edit:'打开编辑抽屉',sync:'同步入口',more:'更多操作'}[e.target.dataset.action]));if(e.target.type==='checkbox')e.target.closest('tr').classList.toggle('selected',e.target.checked)};
function homePreview(){$('home-result').textContent='该角色登录后进入：'+$('home').value+'；优先级：'+$('priority').value} $('home').onchange=homePreview;$('priority').oninput=homePreview;$('role-save').onclick=()=>toast('角色配置仅作展示，未写入系统');
comparisons();renderTable();renderSettings();homePreview();
</script>
</html>
